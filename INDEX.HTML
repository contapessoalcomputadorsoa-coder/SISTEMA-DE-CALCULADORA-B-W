<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculadora web moderna - Preto & Branco">
  <title>Calculator — P&B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/STYLE.CSS">
</head>
<body>

  <div class="calculator-wrapper" id="calculatorWrapper">

    <header class="calculator-header">
      <div class="header-left">
        <img class="brand-logo" src="ASSETS/SISTEMADECALCULADORABW.PNG" alt="Sistema de Calculadora B&W">
        <span class="status-dot" id="statusDot"></span>
      </div>
      <div class="header-right">
        <button class="btn-toggle-science" id="btnToggleScience" aria-label="Modo científico">
          <span class="toggle-label">SCI</span>
          <div class="toggle-track" id="toggleTrack">
            <div class="toggle-thumb"></div>
          </div>
        </button>
        <button class="btn-history-toggle" id="btnHistoryToggle" aria-label="Histórico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="display-section">
      <div class="expression" id="expression"></div>
      <div class="result-container">
        <div class="result" id="result">0</div>
      </div>
    </section>

    <section class="scientific-panel" id="scientificPanel">
      <div class="scientific-grid">
        <button class="btn-sci" data-action="sqrt">√x</button>
        <button class="btn-sci" data-action="square">x²</button>
        <button class="btn-sci" data-action="power">xʸ</button>
        <button class="btn-sci" data-action="pi">π</button>
        <button class="btn-sci" data-action="e">e</button>
        <button class="btn-sci" data-action="sin">sin</button>
        <button class="btn-sci" data-action="cos">cos</button>
        <button class="btn-sci" data-action="tan">tan</button>
        <button class="btn-sci" data-action="log">log</button>
        <button class="btn-sci" data-action="ln">ln</button>
        <button class="btn-sci" data-action="factorial">x!</button>
        <button class="btn-sci" data-action="inverse">1/x</button>
      </div>
    </section>

    <section class="keyboard-section">
      <div class="keyboard-grid">
        <button class="btn btn-clear" data-action="clear">AC</button>
        <button class="btn btn-special" data-action="parenthesis">( )</button>
        <button class="btn btn-special" data-action="percent">%</button>
        <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>

        <button class="btn btn-number" data-action="number" data-value="7">7</button>
        <button class="btn btn-number" data-action="number" data-value="8">8</button>
        <button class="btn btn-number" data-action="number" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*">×</button>

        <button class="btn btn-number" data-action="number" data-value="4">4</button>
        <button class="btn btn-number" data-action="number" data-value="5">5</button>
        <button class="btn btn-number" data-action="number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-">−</button>

        <button class="btn btn-number" data-action="number" data-value="1">1</button>
        <button class="btn btn-number" data-action="number" data-value="2">2</button>
        <button class="btn btn-number" data-action="number" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

        <button class="btn btn-backspace" data-action="backspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
        <button class="btn btn-number" data-action="number" data-value="0">0</button>
        <button class="btn btn-number btn-decimal" data-action="decimal">.</button>
        <button class="btn btn-equals" data-action="equals">=</button>
      </div>
    </section>

  </div>

  <aside class="history-panel" id="historyPanel">
    <div class="history-header">
      <h2 class="history-title">Histórico</h2>
      <button class="btn-clear-history" id="btnClearHistory" aria-label="Limpar histórico">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">Nenhum cálculo ainda</div>
    </div>
  </aside>

  <div class="history-overlay" id="historyOverlay"></div>

  <script src="JS/SCRIPT.JS"></script>
</body>
</html>
